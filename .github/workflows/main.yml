name: Build and Deploy to EC2 project

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/url-shortner-proj .
        docker push ${{ secrets.DOCKER_USERNAME }}/url-shortner-proj

    - name: Save EC2 SSH Key
      run: |
        echo "${{ secrets.EC2_SSH_KEY }}" > ec2-deploy-key.pem
        chmod 600 ec2-deploy-key.pem

    - name: Deploy to EC2
      run: |
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ec2-deploy-key.pem ec2-user@${{ secrets.EC2_HOST }} << EOF
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker pull ${{ secrets.DOCKER_USERNAME }}/url-shortner-proj
          docker stop my-container || true
          docker rm my-container || true
          docker run -d -p 8080:8000 --name my-container ${{ secrets.DOCKER_USERNAME }}/url-shortner-proj
        EOF