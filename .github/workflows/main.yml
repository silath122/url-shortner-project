name: Build and Deploy to EC2

on:
  push:
    branches:
      - main  # Run the workflow on push to the 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest  # Use a Linux runner for this job
    
    steps:
    - name: Checkout the repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build the Docker image
      run: |
        docker build -t my-docker-image .

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa  # Set the correct permissions for the SSH key
        # Verify the contents of the key
        cat ~/.ssh/id_rsa

    - name: SSH to EC2 and deploy
      run: |
        # Debug the SSH key path
        echo "Using SSH private key from: ~/.ssh/id_rsa"
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
          docker pull my-docker-image
          docker stop my-container || true
          docker rm my-container || true
          docker run -d -p 80:8000 --name my-container my-docker-image
        EOF